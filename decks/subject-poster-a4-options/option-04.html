<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A4 Option 04 - Cutout Poster</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 794px;
      height: 1123px;
      overflow: hidden;
      background: #ffea3b;
      color: #111111;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }
    .poster {
      width: 794px;
      height: 1123px;
      position: relative;
      padding: 48px;
    }
    .red {
      position: absolute;
      right: -110px;
      top: 0;
      width: 330px;
      height: 1123px;
      background: #ff5b2c;
      transform: skewX(-9deg);
    }
    .top {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 950;
    }
    .pill {
      background: #111111;
      color: #ffea3b;
      border-radius: 999px;
      padding: 12px 18px;
    }
    h1 {
      position: relative;
      margin: 108px 0 0;
      width: 590px;
      font-size: 88px;
      line-height: 0.95;
      letter-spacing: -3px;
      font-weight: 950;
    }
    .question {
      position: relative;
      width: 500px;
      margin: 32px 0 0;
      font-size: 30px;
      line-height: 1.32;
      font-weight: 900;
      word-break: keep-all;
    }
    .sticker {
      position: absolute;
      right: 74px;
      top: 520px;
      width: 180px;
      height: 180px;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 28px;
      line-height: 1.12;
      font-weight: 950;
      transform: rotate(7deg);
      box-shadow: 14px 14px 0 #ffffff;
    }
    .bottom {
      position: absolute;
      left: 48px;
      right: 48px;
      bottom: 54px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .row {
      background: #ffffff;
      border: 4px solid #111111;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
      min-height: 86px;
    }
    .row small {
      font-size: 16px;
      color: #ff5b2c;
      font-weight: 950;
    }
    .row strong {
      font-size: 26px;
      line-height: 1.22;
      font-weight: 950;
    }
  </style>
</head>
<body>
  <section class="poster">
    <div class="red" aria-hidden="true"></div>
    <div class="top">
      <span>효자고 선택과목</span>
      <span class="pill">경제 · 사회 · 진로 선택</span>
    </div>
    <h1>돈 얘기 말고,<br />선택의 기술</h1>
    <p class="question">가격이 오르는 이유? 환율이 흔들리는 이유? 결국 사람들의 선택을 읽는 일.</p>
    <div class="sticker">뉴스가<br />읽히기<br />시작함</div>
    <section class="bottom">
      <div class="row"><small>배우는 것</small><strong>합리적 선택 · 수요와 공급 · 환율</strong></div>
      <div class="row"><small>맞는 학생</small><strong>뉴스와 돈의 흐름이 궁금한 학생</strong></div>
      <div class="row"><small>진로 연결</small><strong>경제 · 금융 · 경영 · 국제통상</strong></div>
    </section>
  </section>
</body>
</html>

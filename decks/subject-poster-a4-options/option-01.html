<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A4 Option 01 - Type Poster</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 794px;
      height: 1123px;
      overflow: hidden;
      background: #f5f0e8;
      color: #151515;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }
    .poster {
      width: 794px;
      height: 1123px;
      padding: 58px 58px 48px;
      position: relative;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 18px;
      font-weight: 800;
      color: #5f5a52;
    }
    .code {
      writing-mode: vertical-rl;
      position: absolute;
      right: 56px;
      top: 190px;
      font-size: 126px;
      line-height: 0.88;
      letter-spacing: -4px;
      font-weight: 950;
      color: #0b6b52;
    }
    .main {
      position: absolute;
      left: 58px;
      right: 210px;
      top: 210px;
    }
    .subject {
      font-size: 32px;
      font-weight: 900;
      color: #0b6b52;
      margin-bottom: 34px;
    }
    h1 {
      margin: 0;
      font-size: 92px;
      line-height: 0.98;
      letter-spacing: -3px;
      font-weight: 950;
    }
    .bar {
      width: 128px;
      height: 8px;
      background: #151515;
      margin: 36px 0 30px;
    }
    .question {
      margin: 0;
      font-size: 29px;
      line-height: 1.35;
      font-weight: 750;
      color: #343434;
      word-break: keep-all;
    }
    .bottom {
      position: absolute;
      left: 58px;
      right: 58px;
      bottom: 66px;
      border-top: 3px solid #151515;
      padding-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #0b6b52;
      font-weight: 950;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }
    li, .career {
      font-size: 23px;
      line-height: 1.35;
      font-weight: 800;
      word-break: keep-all;
    }
    .source {
      position: absolute;
      left: 58px;
      bottom: 24px;
      font-size: 12px;
      color: #7a746b;
    }
  </style>
</head>
<body>
  <section class="poster">
    <div class="top">
      <div>효자고 선택과목</div>
      <div>사회 · 진로 선택</div>
    </div>
    <div class="code">경제</div>
    <main class="main">
      <div class="subject">경제</div>
      <h1>돈 얘기 말고,<br />선택의 기술</h1>
      <div class="bar"></div>
      <p class="question">왜 가격은 오르고, 환율은 흔들리고, 사람들은 다르게 선택할까?</p>
    </main>
    <section class="bottom">
      <div>
        <h2>배우는 것</h2>
        <ul>
          <li>합리적 선택</li>
          <li>시장의 수요와 공급</li>
          <li>환율과 국제 거래</li>
        </ul>
      </div>
      <div>
        <h2>진로 연결</h2>
        <p class="career">경제학과 · 경영학과 · 국제통상 · 금융 · 회계</p>
      </div>
    </section>
    <div class="source">Source: 2022개정 고등학교 과목 선택 안내자료, 효자고 선택과목 데이터</div>
  </section>
</body>
</html>

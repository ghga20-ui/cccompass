<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editorial Poster</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 720pt;
      height: 405pt;
      overflow: hidden;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      background: #f5efe4;
      color: #171717;
    }
    .slide {
      width: 720pt;
      height: 405pt;
      padding: 42pt 52pt 34pt;
      position: relative;
    }
    .kicker {
      font-size: 12pt;
      font-weight: 700;
      color: #756f66;
      margin-bottom: 26pt;
    }
    h1 {
      margin: 0;
      font-size: 68pt;
      line-height: 0.96;
      letter-spacing: -1.8pt;
      max-width: 470pt;
      font-weight: 900;
    }
    .rule {
      width: 96pt;
      height: 5pt;
      background: #101010;
      margin: 24pt 0 20pt;
    }
    .question {
      width: 392pt;
      margin: 0;
      font-size: 20pt;
      line-height: 1.34;
      font-weight: 700;
      color: #343434;
    }
    .side {
      position: absolute;
      right: 46pt;
      top: 42pt;
      width: 116pt;
      height: 318pt;
      border-left: 2pt solid #171717;
      padding-left: 16pt;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .subject {
      writing-mode: vertical-rl;
      font-size: 38pt;
      line-height: 1;
      font-weight: 900;
      color: #0d6a54;
    }
    .meta {
      font-size: 10.5pt;
      line-height: 1.55;
      color: #4f4a43;
      font-weight: 700;
    }
    .bottom {
      position: absolute;
      left: 52pt;
      right: 52pt;
      bottom: 28pt;
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 26pt;
      align-items: end;
    }
    .chips {
      display: flex;
      gap: 8pt;
      flex-wrap: wrap;
    }
    .chip {
      border: 1.5pt solid #171717;
      padding: 7pt 10pt;
      font-size: 10pt;
      font-weight: 800;
      background: #f5efe4;
    }
    .career {
      font-size: 12pt;
      line-height: 1.45;
      color: #4b463f;
      font-weight: 700;
    }
    .source {
      position: absolute;
      right: 52pt;
      bottom: 10pt;
      font-size: 7pt;
      color: #8a8175;
    }
  </style>
</head>
<body>
  <section class="slide">
    <p class="kicker">OPTION 01 · EDITORIAL POSTER</p>
    <h1>돈 얘기 말고,<br />선택의 기술</h1>
    <div class="rule"></div>
    <p class="question">왜 가격은 오르고, 환율은 흔들리고, 사람들은 다르게 선택할까?</p>
    <aside class="side">
      <div class="subject">경제</div>
      <div class="meta">사회<br />진로 선택<br />효자고 선택과목</div>
    </aside>
    <div class="bottom">
      <div class="chips">
        <span class="chip">합리적 선택</span>
        <span class="chip">수요와 공급</span>
        <span class="chip">환율</span>
      </div>
      <p class="career">경제학과 · 경영학과 · 국제통상 · 금융 · 회계</p>
    </div>
    <div class="source">Source: 2022개정 고등학교 과목 선택 안내자료</div>
  </section>
</body>
</html>

/** Lightweight attribute renderer. Creates SVG nodes once; no per-frame DOM parsing. */
function createPlayer(root, env=window) {

 };

  play.setAttribute('aria-label',intent&&!reduced?'모션그래픽 일시정지':'모션그래픽 재생');

services:
  postgres:
    image: postgres:16-alpine
    container_name: generic-curriculum-test-postgres
    environment:
      POSTGRES_DB: generic_curriculum_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d generic_curriculum_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

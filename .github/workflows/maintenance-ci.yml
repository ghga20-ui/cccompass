name: CurriCompass CI

on:
  pull_request:
  push:
    branches:
      - codex/generic-curriculum-assistant-clean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: generic-app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Prisma generation needs a URL; no database service or credentials are used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/curriculum_ci?schema=public
      CURRICULUM_PARSER_PROVIDER: mock
      CURRICULUM_STRUCTURER_PROVIDER: mock
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.7.0
          run_install: false
          package_json_file: generic-app/package.json
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and generate Prisma client
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  worker:
    name: Parser worker checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parser-worker
    env:
      PARSER_ADAPTER: mock
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.7.0
          run_install: false
          package_json_file: parser-worker/package.json
      - name: Install locked dependencies for tests
        # Vitest/Vite need native optional bindings. The committed pnpm hook and
        # frozen lockfile still exclude Kordoc's optional OCR/model packages.
        # This per-command override does not change the production .npmrc.
        run: pnpm install --frozen-lockfile --config.optional=true
      - name: Test
        run: pnpm run test
      - name: Typecheck
        run: pnpm run lint
      - name: Build
        run: pnpm run build
